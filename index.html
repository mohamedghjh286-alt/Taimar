<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مؤقّت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#14213d; --muted:#6b7690;
  --track:#e3e8f1; --accent:#2f5bea; --accent-ink:#fff; --done:#e8590c;
  --shadow:0 30px 80px -30px rgba(20,33,61,.3);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1220;--card:#151c30;--ink:#eef1f8;--muted:#8b96b3;--track:#232c46;--accent:#6c8cff;--accent-ink:#0d1220;--done:#ff8a4c;--shadow:0 30px 80px -30px rgba(0,0,0,.7)}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  display:grid;place-items:center;padding:24px;
}
.app{
  width:100%;max-width:1060px;background:var(--card);border-radius:32px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden;min-height:min(620px,90vh);
}
.stage{display:grid;place-items:center;padding:40px;position:relative}
.ring{position:relative;width:min(440px,100%);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .track{stroke:var(--track)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset .25s linear,stroke .3s}
.done .bar{stroke:var(--done)}
.display{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;direction:ltr;
  font-size:clamp(48px,7.5vw,88px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:2px;
}
.display small{display:block;font-size:16px;color:var(--muted);letter-spacing:0;font-weight:400;margin-top:6px;direction:rtl}
.done .display{color:var(--done);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.icon{
  position:absolute;top:20px;inset-inline-start:20px;width:42px;height:42px;border-radius:12px;
  border:1.5px solid var(--track);background:transparent;color:var(--muted);cursor:pointer;font-size:18px;
}
.icon:hover{color:var(--accent);border-color:var(--accent)}

.panel{padding:44px 40px;border-inline-start:1.5px solid var(--track);display:flex;flex-direction:column;gap:26px;justify-content:center}
h1{font-size:22px;font-weight:600}
h2{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:10px}
.inputs{display:flex;gap:12px;direction:ltr}
.inputs label{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);text-align:center}
.inputs input{
  width:100%;height:58px;border-radius:14px;border:1.5px solid var(--track);
  background:transparent;color:var(--ink);font:inherit;font-size:24px;text-align:center;font-variant-numeric:tabular-nums;
}
.inputs input:focus{outline:none;border-color:var(--accent)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{
  border:1.5px solid var(--track);background:transparent;color:var(--ink);
  border-radius:12px;padding:11px 8px;font:inherit;font-size:15px;cursor:pointer;transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.actions{display:flex;gap:12px}
.btn{flex:1;height:58px;border-radius:16px;border:0;font:inherit;font-size:18px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:var(--track);color:var(--ink);flex:.6}
.keys{font-size:13px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
kbd{font:inherit;font-size:12px;border:1.5px solid var(--track);border-radius:6px;padding:1px 7px;margin-inline-end:4px;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* وضع ملء الشاشة: الحلقة فقط */
.full .app{grid-template-columns:1fr;max-width:none;height:100vh;border-radius:0;box-shadow:none}
.full body{padding:0}
.full .panel{display:none}
.full .ring{width:min(78vh,80vw)}
.full .display{font-size:clamp(60px,14vh,150px)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .panel{border-inline-start:0;border-top:1.5px solid var(--track);padding:28px 22px}
  .stage{padding:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="card">
  <section class="stage">
    <button class="icon" id="fs" title="ملء الشاشة (F)" aria-label="ملء الشاشة">⛶</button>
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"/>
        <circle class="bar" id="bar" cx="60" cy="60" r="54"/>
      </svg>
      <div class="display" role="timer"><span id="display">00:05:00</span><small id="status">جاهز</small></div>
    </div>
  </section>

  <section class="panel">
    <h1>المؤقّت</h1>
    <div>
      <h2>المدة</h2>
      <div class="inputs">
        <label>ساعات<input id="h" type="number" min="0" max="99" value="0"></label>
        <label>دقائق<input id="m" type="number" min="0" max="59" value="5"></label>
        <label>ثواني<input id="s" type="number" min="0" max="59" value="0"></label>
      </div>
    </div>
    <div>
      <h2>مدد جاهزة</h2>
      <div class="presets">
        <button class="chip" data-s="60">دقيقة</button>
        <button class="chip" data-s="300">5 دقائق</button>
        <button class="chip" data-s="600">10 دقائق</button>
        <button class="chip" data-s="1500">25 دقيقة</button>
        <button class="chip" data-s="1800">30 دقيقة</button>
        <button class="chip" data-s="3600">ساعة</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="start">ابدأ</button>
      <button class="btn ghost" id="reset">إعادة</button>
    </div>
    <div class="keys">
      <span><kbd>Space</kbd>ابدأ / إيقاف</span>
      <span><kbd>R</kbd>إعادة</span>
      <span><kbd>F</kbd>ملء الشاشة</span>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const bar = $('bar'), display = $('display'), card = $('card'), status = $('status');
const startBtn = $('start'), resetBtn = $('reset');
const inputs = [$('h'), $('m'), $('s')];
const C = 2 * Math.PI * 54;
bar.style.strokeDasharray = C;

let total = 0, endAt = 0, left = 0, tick = null, running = false, audioCtx = null;

const pad = n => String(n).padStart(2, '0');
const fmt = sec => `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;
const readInputs = () => {
  const [h, m, s] = inputs.map(i => Math.max(0, parseInt(i.value) || 0));
  return h*3600 + m*60 + s;
};
const writeInputs = sec => {
  $('h').value = Math.floor(sec/3600);
  $('m').value = Math.floor(sec%3600/60);
  $('s').value = sec%60;
};
const draw = ms => {
  const sec = Math.ceil(ms/1000);
  display.textContent = fmt(sec);
  bar.style.strokeDashoffset = total ? C * (1 - ms/(total*1000)) : 0;
  document.title = running ? `${fmt(sec)} • مؤقّت` : 'مؤقّت';
};
const lock = on => inputs.forEach(i => i.disabled = on);

function ensureAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    ensureAudio();
    [0, .4, .8].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const T = audioCtx.currentTime + t;
      g.gain.setValueAtTime(.0001, T);
      g.gain.exponentialRampToValueAtTime(.3, T + .02);
      g.gain.exponentialRampToValueAtTime(.0001, T + .3);
      o.start(T); o.stop(T + .32);
    });
  }catch(e){}
}

function loop(){
  const ms = endAt - Date.now();
  if (ms <= 0){ finish(); return; }
  left = ms; draw(ms);
}
function finish(){
  clearInterval(tick); running = false; left = 0;
  display.textContent = '00:00:00';
  bar.style.strokeDashoffset = C;
  card.classList.add('done');
  status.textContent = 'انتهى الوقت';
  startBtn.textContent = 'ابدأ'; lock(false);
  document.title = 'انتهى الوقت!';
  beep();
}
function start(){
  if (running){
    clearInterval(tick); running = false;
    left = endAt - Date.now();
    startBtn.textContent = 'استمرار'; status.textContent = 'متوقف مؤقتًا'; draw(left); return;
  }
  card.classList.remove('done');
  if (!left){
    total = readInputs();
    if (!total){ inputs[1].focus(); return; }
    left = total * 1000;
  }
  ensureAudio();
  endAt = Date.now() + left;
  running = true; lock(true);
  startBtn.textContent = 'إيقاف مؤقت'; status.textContent = 'قيد العمل';
  tick = setInterval(loop, 200); loop();
}
function reset(){
  clearInterval(tick); running = false; left = 0;
  card.classList.remove('done');
  startBtn.textContent = 'ابدأ'; status.textContent = 'جاهز'; lock(false);
  total = readInputs();
  display.textContent = fmt(total);
  bar.style.strokeDashoffset = 0;
  document.title = 'مؤقّت';
}
function toggleFull(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.addEventListener('fullscreenchange', () =>
  document.documentElement.classList.toggle('full', !!document.fullscreenElement));

startBtn.onclick = start;
resetBtn.onclick = reset;
$('fs').onclick = toggleFull;
inputs.forEach(i => i.addEventListener('input', () => {
  if (!running){ left = 0; total = readInputs(); display.textContent = fmt(total); }
}));
document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  if (running) return;
  writeInputs(+b.dataset.s); reset();
});
document.addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement || e.ctrlKey || e.metaKey) return;
  if (e.code === 'Space'){ e.preventDefault(); start(); }
  else if (e.key.toLowerCase() === 'r') reset();
  else if (e.key.toLowerCase() === 'f') toggleFull();
});
reset();
</script>
</body>
</html>
